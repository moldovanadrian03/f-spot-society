<section
  class="cards-section"
  appAnimateOnScroll
  (visible)="isVisible = true"
  [@slideInUp]="isVisible ? 'visible' : 'hidden'">
  <h1 class="section-title">Cunoaște echipa</h1>
  <div class="container">
    <div class="card" *ngFor="let member of members">
      <img [src]="member.image" alt="{{ member.title }}" />
      <h3>{{ member.title }}</h3>
    </div>
  </div>
</section>
