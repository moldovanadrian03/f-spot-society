<div id="navbar-container">
  <section class="navbar-row1">
    <img
      class="logo"
      src="assets/about.jpg"
      alt="logo"
      (click)="scrollTo(INFO_SECTION)"
    />
    @if(isMobileView) {
      <button
        aria-label="Toggle sidenav"
        mat-icon-button
        class="sidenav-button"
        (click)="toggleSidenav()"
      >
        <mat-icon>menu</mat-icon>
      </button>
  }
  </section>
  @if(!isMobileView) {
    <section class="navbar-row2">
      <ul>
        <li (click)="scrollTo(ABOUT_SECTION)">
          <img class="cherry" *ngIf="activeSection === ABOUT_SECTION" src="assets/cherry.png" />
          Despre noi
        </li>
        <li (click)="scrollTo(INFO_SECTION)">
          <img class="cherry" *ngIf="activeSection === INFO_SECTION" src="assets/cherry.png" />
          Ce facem
        </li>
        <li (click)="scrollTo(MEMBERS_SECTION)">
          <img class="cherry" *ngIf="activeSection === MEMBERS_SECTION" src="assets/cherry.png" />
          Membrii
        </li>
        <li (click)="scrollTo(PROJECTS_SECTION)">
          <img class="cherry" *ngIf="activeSection === PROJECTS_SECTION" src="assets/cherry.png" />
          Proiecte
        </li>
        <li (click)="scrollTo(FOOTER_SECTION)">
          <img class="cherry" *ngIf="activeSection === FOOTER_SECTION" src="assets/cherry.png" />
          Contact
        </li>
      </ul>
    </section>
  }
  @if(isMobileView && isSidenavOpened) {
    <div class="backdrop" (click)="toggleSidenav()" ></div>

  }
  @if(isSidenavOpened) {
    <section class="sidenav-container">
      <ul>
        <li (click)="toggleSidenav(); scrollTo(ABOUT_SECTION)">
          <img class="cherry" *ngIf="activeSection === ABOUT_SECTION" src="assets/cherry.png" />
          Despre noi
        </li>
        <li (click)="toggleSidenav(); scrollTo(INFO_SECTION)">
          <img class="cherry" *ngIf="activeSection === INFO_SECTION" src="assets/cherry.png" />
          Ce facem
        </li>
        <li (click)="toggleSidenav(); scrollTo(MEMBERS_SECTION)">
          <img class="cherry" *ngIf="activeSection === MEMBERS_SECTION" src="assets/cherry.png" />
          Membrii
        </li>
        <li (click)="toggleSidenav(); scrollTo(PROJECTS_SECTION)">
          <img class="cherry" *ngIf="activeSection === PROJECTS_SECTION" src="assets/cherry.png" />
          Proiecte
        </li>
        <li (click)="toggleSidenav(); scrollTo(FOOTER_SECTION)">
          <img class="cherry" *ngIf="activeSection === FOOTER_SECTION" src="assets/cherry.png" />
          Contact
        </li>
      </ul>
    </section>
  }
</div>
